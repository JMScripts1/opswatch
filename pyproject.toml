[project]
name = "opswatch"
version = "0.1.0"
description = "Self-hosted IT health monitoring with automatic ticketing"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server", "agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header() in defaults is the intended pattern
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# env vars must be set before the app is imported
"tests/conftest.py" = ["E402", "I001"]
